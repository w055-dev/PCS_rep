services:
  ascii-paint:
    image: ascii-paint
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ascii-paint
    stdin_open: true
    tty: true
    volumes:
      - ./output:/app/output
      - ./projects:/app/projects
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
    working_dir: /app